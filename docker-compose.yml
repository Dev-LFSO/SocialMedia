services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME:-socialmedia}
      POSTGRES_USER: ${DB_USER:-socialmedia_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-senha_local_dev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-socialmedia_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-socialmedia}
      DB_USER: ${DB_USER:-socialmedia_user}
      DB_PASSWORD: ${DB_PASSWORD:-senha_local_dev}
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      NEWS_API_KEY: ${NEWS_API_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: