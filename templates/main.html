<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block css %}<link rel="stylesheet" href="{% static "css/style.css" %}">{% endblock %}
    <title>{% block title %}Social Media{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="shortcut icon" href="{% static "imgs/favicon.ico" %}" type="image/x-icon">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-left">
                <a href="{% url "home" %}" class="home" aria-label="Início" title="Início">
                    <i class="fa-solid fa-house"></i>
                </a>
            </div>
            <p class="title">Social Media</p>
            <div class="header-right">
                {% if user.is_authenticated %}
                <span class="greeting">Olá, {{ user.username }}</span>
                <a href="{% url "users:logout" %}" class="logout" aria-label="Sair" title="Sair">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </a>
                {% else %}
                <a href="{% url "users:register" %}" class="register" aria-label="Criar conta" title="Criar conta">
                    <i class="fa-solid fa-user-plus"></i>
                </a>
                <a href="{% url "users:login" %}" class="login" aria-label="Entrar" title="Entrar">
                    <i class="fa-solid fa-right-to-bracket"></i>
                </a>
                {% endif %}
            </div>
        </div>
    </header>

    {% block content %}{% endblock %}

    <footer>
        <p>© 2026 Social Media. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
