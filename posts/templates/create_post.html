{% extends "main.html" %}

{% block title %}Novo post - Social Media{% endblock %}

{% block content %}
<main>
    {% include "sidebar.html" %}

    <section class="content-wide">
        <div class="compose-wrap">
            <form method="post" class="compose-card" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="compose-card__header">
                    <h1 class="title">Criar post</h1>
                    <a href="{% url "posts:all_posts" %}" class="link-back">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Voltar para o feed</span>
                    </a>
                </div>

                {% if error %}
                <div class="error">
                    <p>{{ error }}</p>
                </div>
                {% endif %}

                <div class="inputs">
                    <label for="title">Título</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        maxlength="200"
                        placeholder="Do que você quer falar?"
                        autocomplete="off"
                        value="{{ title|default:'' }}"
                        required>
                    <span class="field-hint" id="title-counter">0/200</span>

                    <label for="content">Conteúdo</label>
                    <textarea
                        id="content"
                        name="content"
                        rows="8"
                        placeholder="Escreva o que estiver pensando..."
                        required>{{ content|default:'' }}</textarea>

                    <label for="image">Imagem (opcional)</label>
                    <input
                        type="file"
                        id="image"
                        name="image"
                        accept="image/jpeg,image/png,image/webp,image/gif">
                    <span class="field-hint">JPG, PNG, WEBP ou GIF, até 8MB.</span>

                    <div id="image-preview-wrap" style="display: none; margin-top: 10px;">
                        <img id="image-preview" src="" alt="Pré-visualização" style="max-width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--line);">
                    </div>
                </div>

                <div class="compose-card__actions">
                    <a href="{% url "posts:all_posts" %}" class="button-ghost">Cancelar</a>
                    <button type="submit" class="button-submit">Publicar</button>
                </div>
            </form>
        </div>
    </section>
</main>

<script>
    (function () {
        var titleInput = document.getElementById('title');
        var counter = document.getElementById('title-counter');
        var limit = titleInput.getAttribute('maxlength');

        function updateCounter() {
            var length = titleInput.value.length;
            counter.textContent = length + '/' + limit;
            counter.classList.toggle('is-near-limit', length >= limit - 20);
        }

        titleInput.addEventListener('input', updateCounter);
        updateCounter();

        var imageInput = document.getElementById('image');
        var previewWrap = document.getElementById('image-preview-wrap');
        var preview = document.getElementById('image-preview');

        imageInput.addEventListener('change', function () {
            var file = imageInput.files[0];
            if (!file) {
                previewWrap.style.display = 'none';
                return;
            }
            var reader = new FileReader();
            reader.onload = function (e) {
                preview.src = e.target.result;
                previewWrap.style.display = 'block';
            };
            reader.readAsDataURL(file);
        });
    })();
</script>
{% endblock %}
