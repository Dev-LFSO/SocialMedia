{% extends "main.html" %}

{% block content %}
<main class="auth-main">
    <div class="auth-card" style="flex-direction: column; text-align: center; align-items: center; justify-content: center;">
        <i class="fa-solid fa-envelope-circle-check fa-2x" style="color: var(--brand); margin-bottom: 8px;"></i>
        <h1 class="title" style="align-self: center;">Verifique seu e-mail</h1>
        <p style="font-size: 14px; color: var(--ink-soft); text-align: justify;">
            Se o e-mail informado estiver cadastrado, você receberá um link com instruções para redefinir sua senha em instantes.
        </p>
        <a href="{% url 'users:login' %}" class="button-ghost" style="text-decoration: none; margin-top: 8px;">Voltar para o login</a>
    </div>
</main>
{% endblock %}
