{% extends "main.html" %}

{% block content %}
<main class="auth-main">
    <div class="auth-card">
        <h1 class="title">Esqueceu sua senha?</h1>
        <p style="font-size: 14px; color: var(--ink-faint); margin-top: -8px;">
            Digite seu e-mail cadastrado e enviaremos um link para redefinir sua senha.
        </p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="button-submit">Enviar link de recuperação</button>
        </form>

        <a href="{% url 'users:login' %}" class="link-back" style="margin-top: 8px;">
            <i class="fa-solid fa-arrow-left"></i> Voltar para o login
        </a>
    </div>
</main>
{% endblock %}
