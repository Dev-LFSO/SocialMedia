{% extends "main.html" %}

{% block content %}
<main class="auth-main">
    <div class="auth-card" style="text-align: center;">
        <i class="fa-solid fa-circle-check fa-2x" style="color: var(--success); margin-bottom: 8px;"></i>
        <h1 class="title">Senha redefinida!</h1>
        <p style="font-size: 14px; color: var(--ink-soft);">
            Sua senha foi alterada com sucesso. Já pode entrar com a nova senha.
        </p>
        <a href="{% url 'users:login' %}" class="button-submit" style="text-decoration: none; display: inline-block; margin-top: 8px;">Ir para o login</a>
    </div>
</main>
{% endblock %}
